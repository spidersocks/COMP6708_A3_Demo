server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: proxy API when FE and BE share a domain
    # location /api/ {
    #     proxy_pass http://brightnest-api:8000/;
    # }
}
